
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLead AI</title>
</head>
<body>
    <h1>SmartLead AI</h1>
    <p>DigiPath hakkında sorularınızı yazabilirsiniz.</p>

    <div id="messages" aria-live="polite"></div>

    <form id="chat-form">
        <input
            id="message-input"
            type="text"
            placeholder="Mesajınızı yazın"
            aria-label="Mesajınız"
            required
        >
        <button type="submit">Gönder</button>
    </form>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message-input");
        const messages = document.getElementById("messages");

        function addMessage(sender, text) {
            const paragraph = document.createElement("p");
            paragraph.textContent = sender + ": " + text;
            messages.appendChild(paragraph);
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage("Siz", message);
            input.value = "";

            try {
                const response = await fetch("/api/sohbet", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (!response.ok || !data.basari) {
                    addMessage("Sistem", data.error || "Bir hata oluştu.");
                    return;
                }

                addMessage("SmartLead AI", data.reply);
            } catch (error) {
                addMessage("Sistem", "Sunucuya bağlanılamadı.");
            }
        });
    </script>
</body>
</html>
